{% extends "base.html" %}
{% block title %}Register · ExpenseFlow{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
  <div class="card ef-card p-4">
    <h3 class="mb-3">Create your account</h3>
    <form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label">Name</label><input name="name" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Password (6+ chars)</label><input type="password" name="password" minlength="6" class="form-control" required></div>
      <button class="btn btn-primary w-100">Register</button>
    </form>
    <p class="mt-3 mb-0 text-center">Already registered? <a href="{{ url_for('login') }}">Login</a></p>
  </div>
</div></div>
{% endblock %}
